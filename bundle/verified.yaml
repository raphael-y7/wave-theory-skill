  - cap.elliott-wave.applicability-gate-skill
  - cap.elliott-wave.recursive-hold-skill
  card: cards/wave-labeling-skill.md
  frontmatter:
    description: '用于在任意走势图上建立波浪坐标系：确认主方向后数出五浪（1/3/5 驱动、2/4 调整），奇数浪拆 5 子浪、偶数浪拆 3 子浪、调整内部 a-b-c（a/c 再拆五、b
      拆三）逐级递归；用倾斜规则检验（浪3高于浪1、浪5高于浪3、浪4低点不达浪2水平且不与浪1高点重叠），再按九级专名（次微浪→特大超级循环浪）与表 1 符号标注，单一标的独立计数、无需第二指数验证。适用："帮我数浪/这是第几浪/浪级怎么标/count
      waves/what wave are we in"。不适用：无趋势整理市、预测点位（终点预测转 wave-five-end-skill、卖出判定转 recursive-hold-skill、调整形态分类转 correction-classifier-skill）。关键trigger：数浪、浪位、浪级、计数有效性、wave
      labeling。

      '
