  importance: critical
  importance_rationale: 映射 task-11——全书唯一成体系的进出场规则，输出持仓分级卖出触发条件表，是持有者的核心操作规程。
  one_liner: 已建仓者按"本级第四浪未走完/第五浪未耗尽不卖"逐级下钻核对至最内层第五浪，以"最内层第五浪耗尽+破上通道线（对数图）+同级天量"三证齐备处卖出。
  intents:
  - 制定持仓卖出计划
