  card: cards/correction-classifier-skill.md
  frontmatter:
    description: '用于对已走完（或接近走完）的三浪调整 A-B-C 做形态归类与后市强度预警：读浪B相对调整起点、浪C相对浪A低点两个位置——B明显低于起点且C创新低=之字形（后市一般）；B回到起点且C与A持平=平台形（后市较长强劲波动）；B越过起点创新高且C破A=不规则形(1)；B不创新高且C不破A=不规则形(2)（调整浅而缓）。熊市向上反弹按同几何镜像评估（B失守起点且C乏力=超级弱势）。适用："这段回调是什么形态/B浪创新高/平台形是不是预示强势/what
      type of correction"。不适用：形态未走完时抢跑判型、三角形专查（转triangle-alternation）、延长浪两次反转推演（转extension-reversal）。关键trigger：调整浪四分类、之字/平台/不规则、强度预警。

      '
    tags:
    - analysis
    - elliott-wave
    - correction-patterns
    - strength-forecast
    - decision-support
