  title: 调整浪四分类判别与强度预警
  importance: high
  importance_rationale: 映射 task-06——建仓时点判断的核心判别卡，把调整浪升格为可分类、可读出后市强度的预测结构。
  one_liner: 调整走完后按"浪B相对调整起点、浪C相对浪A低点"两个几何读数归入之字形/平台形/不规则形四类，再折算后市强度（之字=一般、平台=强势、终点高于a=超级强势；熊市镜像反向）。
  intents:
  - 判断调整浪属于哪类形态
  - 用调整形态预估后市强度
  - 评估熊市反弹质量
  - 等调整走完确认后再建仓
