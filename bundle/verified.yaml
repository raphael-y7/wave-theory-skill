    description: '用户想把波浪分析迁移到非价格数据（成交量/换手率/产量/货运量/产值等），或数据有季节性

      扰动，或某领域没有可靠价格数据，或想把"周期"切分严格化时使用。三招：逆指标法（无基础

      数据）、替代序列法（小浪级噪声大）、去季节化十年基线法（季节性）；三招都无合适指标即

      停止，不得强行数浪。不用于：多序列时间同步监测（走 cross-market-sync）、"该不该用波浪

      理论"的五条件闸门（走 applicability-gate-skill）、量能-浪序绑定规则（走 volume-adjudication）。

