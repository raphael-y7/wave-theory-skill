- capability_id: cap.elliott-wave.wave-five-end-skill
  revision: 1
  status: active
  slug: wave-five-end-skill
  title: 第五浪终点定位与终结判定（通道法三步+三联证）
  importance: critical
  importance_rationale: 映射 task-01/02/05——"浪5结束的位置决定投资者何时平仓、盈利多少"，是全书最高价值流程与平仓决策核心。
  one_liner: 浪4走完后连浪2、浪4终点画基准线、过浪3顶点作平行上通道线，浪5止于该线附近即为平仓区；破上通道线+同级天量为终结确认，未破线且回落为走软预警。
  intents:
  - 定位第五浪终点
  - 预测浪5目标位
  - 判断何时清仓
  - 画通道锁定整轮运动
  keywords:
  - 第五浪终点
  - 浪5目标
  - 通道法
  - 上通道线
  - 基准线
  - 最终通道
  - 破上通道线
  - 天量
  - wave 5 target
  - channel method
  - exit point
  also_read:
  - cap.elliott-wave.recursive-hold-skill
  - cap.elliott-wave.failure-irregular-top-skill
  - cap.elliott-wave.volume-adjudication
  - cap.elliott-wave.multi-timeframe
  - cap.elliott-wave.wave-labeling-skill
  card: cards/wave-five-end-skill.md
  frontmatter:
    description: '用于一轮上涨中预测第五浪终点与平仓时点：浪2走完画初始通道、浪3后强制重绘、浪4后画最终通道（连浪2浪4终点为基准线、过浪3顶点作平行上通道线），浪5通常止于上通道线附近；破线+成交量明显放大（高级别用对数图）为终结确认，未破线且回落为走软预警。适用情境："浪5目标位在哪/何时清仓/帮我把这轮行情的终点框出来/wave
      5 target/exit"。不适用于：无趋势整理市、拐点无法确认时强行作图、把通道落点当精确卖点；浪5细分出五子浪（延长）或未创新高（失败浪）时转用对应卡。关键trigger：第五浪、浪5终点、通道法、上通道线、平仓时点、破线天量。

      '
    tags:
    - decision
    - trading
    - elliott-wave
    - channel-method
    - exit-timing
