      independent_reuse: true
      independent_eval: true
    notes: pack 重评晋级：『这段回调是什么形态/预示后市强弱』独立可询；浪B/浪C两读数→四分类→强度折算的契约自足；建仓时点核心判别，每次调整行情都会调用。
- capability_id: cap.elliott-wave.extension-reversal
  revision: 1
  status: active
  slug: extension-reversal
  title: 延长浪识别与两次反转推演
  importance: high
  importance_rationale: 映射 task-07——1929 式顶部风险识别程序，延长浪恰逢第五大浪走完时的不规则 A-B-C 杀跌推演是书中唯一的系统性风险路径推演。
  one_liner: 驱动浪内细分出五个小浪即延长浪（一轮至多一个、最常浪5），它永非终点——其后先以三浪回延长浪起点（第一次反转），再顺大势且通常超延长幅度（第二次反转）；恰逢第五大浪走完则构成不规则A-B-C，浪C杀跌至前轮第五大浪起点附近。
  intents:
  - 识别延长浪
  - 推演延长浪后的两次反转路径
  - 判断顶后新高是不是B浪
  - 熊市向下延长时的持仓处置
  keywords:
  - 延长浪
  - 延长浪中的延长浪
  - 两次反转
  - 双重反转
  - 第一次反转
  - 第二次反转
  - 延长浪起点
  - 不规则顶
  - 浪C杀跌
  - 向下延长
  - extension
  - double reversal
  also_read:
  - cap.elliott-wave.volume-adjudication
  - cap.elliott-wave.failure-irregular-top-skill
  card: cards/extension-reversal-skill.md
  frontmatter:
    description: '用于识别延长浪（被细分出五个小浪的驱动浪，浪1/3/5皆可、最常浪5、一轮至多一个）并按八规律推演其后路径：延长浪永非终点，其后两次反转——第一次立即以三浪回落到延长浪起点水平，第二次顺大方向且通常超过延长浪幅度；若恰逢第五大浪走完，两次反转构成不规则调整的浪A/浪B（最高价顶在B），随后向下五浪浪C快速杀跌至前轮第五大浪起点附近。熊市向下延长规律照用，持多头者不应立刻卖出（先有三浪回调再试低点）。适用："这段是延长浪吗/延长浪后怎么走/顶后创新高是不是B浪/down
      extension套牢怎么办"。不适用：一般浪5终点定位（转wave-five-end-skill）、调整形态分类（转correction-classifier-skill）；禁止用"永非终点"豁免止损（原书无幅度算法、预测影响作者自认未确定）。关键trigger：延长浪、两次反转、双重反转、B浪超前顶。

      '
    tags:
    - analysis
    - trading
    - elliott-wave
    - extension
    - reversal-forecast
    - risk-path
  source_evidence:
