  - cap.elliott-wave.bear-diagnosis-skill
  card: cards/recursive-hold-skill.md
  frontmatter:
    description: '用于已建仓持有者的卖出判定：只要本级第五浪未走完，其内部必还有一整套更小级别五浪，故逐级下钻（中浪→小浪→细浪→微浪→次微浪，60分钟图）核对，每一级"第五浪走完前不卖"；数到最内层后以"破上通道线（高级别须对数图验证）+同级天量（大于此前同级任何一浪）"双证确认终点后卖出。适用："该不该卖/什么时候卖/帮我定持有计划/holding
      plan/when to sell"。不适用：未建仓者的买入决策（转 bear-diagnosis-skill）、浪5终点点位预测（转 wave-five-end-skill）、浪5出现延长浪（转 extension-reversal）或未创新高（转
      failure-irregular-top-skill）。注意：原书无止损规程、天量无量化阈值。关键trigger：递归持有、卖出规则、第五浪耗尽、破线天量。

      '
