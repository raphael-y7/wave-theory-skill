    location: 第五章（延长浪节图30-31；延长浪后的市场表现节规律(1)-(8)、图15、图32、表2）
  promotion:
    destination: router
    gate:
      independent_intent: true
      independent_contract: true
      independent_run: true
      independent_reuse: true
      independent_eval: true
    notes: 五判据均通过但预算让位：与 failure-irregular-top-skill 在『顶后创新高是不是B浪/双重反转』近邻同题，二者同时晋级必然双触发；按触发可分性与保命价值排序让位给 failure-irregular-top-skill。本卡留路由入口，经 wave-labeling-skill/volume-adjudication/failure-irregular-top-skill 组合可达，不淘汰。
