entry:
  name: wave-theory-skill
  description: 艾略特波浪理论（1938 原著专业解读版）蒸馏的股票波浪分析技能：九级浪级标注与数浪、通道法三步预测第五浪终点与平仓区、调整浪四分类与强度预警、延长浪两次反转、三角形与交替规则、量能裁决、熊市阶段诊断与长线建仓点、递归持有卖出规则。适用于
    A 股/美股等趋势行情的技术分析辅助；不适用于基本面估值、盘整市细节数浪与精确点位算法。
  core_principles:
  - 五浪推进+三浪调整的分形嵌套是一切判定的坐标系（九级浪级标注）
  - 通道作图法把'何时平仓'变成可执行的几何规程（浪2后画通道，浪4后锁定浪5终点）
  - 形态走完才有预警价值：右侧确认、跟随趋势，放弃左侧精准预测（作者与点评者共同警示）
  - 成交量与多周期是浪性判别与防骗的第二证据链（1/3/5放量、2/4缩量；周线对数/日线算术）
  - 每条规则自带例外条款：先过适用域闸门（五条件、趋势行情），再下判定
  out_of_scope:
  - 基本面估值与财报分析
  - 止损与仓位管理规程（原书未提供，需用户自备风控）
  - 波浪幅度/点位的精确算法（原书无公式；点评者斐波那契参数未经核实）
  - 盘整/无趋势行情的细节数浪（原书明确限定趋势市）
  - 1938 年美股特有制度指标（NYSE 席位价格等）的直接套用
  stop_conditions:
  - 数浪出现多个自洽矛盾方案且无法用通道/量能/周期裁决时，停止下结论并如实呈现分歧
  - 标的或行情不满足形态完备五条件、或处于盘整市时，拒绝输出浪级判定
  - 缺少必要输入（周期数据、成交量、图表类型）时先询问，不得静默猜值
router_entry:
  name: wave-theory-skill-router
  description: 艾略特波浪理论能力卡来源入口（pack 路由）：7 个高频高危能力已晋级为独立 Skill（wave-five-end-skill/wave-labeling-skill/recursive-hold-skill/correction-classifier-skill/failure-irregular-top-skill/bear-diagnosis-skill/applicability-gate-skill），其余 8 张能力卡（延长浪两次反转/量能裁决/三角形与交替/多周期图法/图法20条总纲/跨市场同步/非价格序列/点评者心法）按意图路由；整书概览、术语与速查也经本入口访问。
promotion_budget: 8
